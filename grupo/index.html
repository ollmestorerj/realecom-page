<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;background:#08080A;color:#EFEFEF;
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:40px 24px;position:relative;overflow:hidden;
}
.glow{
  position:absolute;top:-180px;left:50%;transform:translateX(-50%);
  width:640px;height:640px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,.18) 0%,transparent 65%);

.box{position:relative;z-index:1;max-width:460px;width:100%;text-align:center}
.logo{width:220px;max-width:70%;height:auto;margin:0 auto 44px;display:block}
h1{
  font-size:clamp(24px,6vw,32px);font-weight:700;line-height:1.25;
  letter-spacing:-.5px;color:#fff;margin-bottom:36px;
}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:20px 24px;border-radius:14px;
  background:#22C55E;color:#fff;font-size:18px;font-weight:700;text-decoration:none;
  box-shadow:0 10px 30px rgba(34,197,94,.3);
  animation:pulse 2s ease-in-out infinite;
  transition:transform .15s;
}
.btn:active{transform:scale(.98)}
.btn svg{width:24px;height:24px;flex-shrink:0}
@keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(34,197,94,.3)}50%{box-shadow:0 10px 44px rgba(34,197,94,.55)}}
</style>
